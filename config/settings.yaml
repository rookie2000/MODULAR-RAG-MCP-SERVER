# Modular RAG MCP Server - Configuration
# Commit-safe runtime configuration. Keep real API keys in config/test_credentials.yaml.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "openai"  # Options: openai, azure, ollama, deepseek, minimax
  model: "mimo-v2-pro"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  api_key: ""
  base_url: "https://token-plan-cn.xiaomimimo.com/v1"  # OpenAI-compatible endpoint for MiMo
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  provider: "minimax"  # Options: openai, azure, ollama, minimax
  model: "embo-01"
  dimensions: 1536
  base_url: "https://api.minimax.chat/v1"
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""

# =============================================================================
# Vision LLM Configuration (for Image Captioning)
# =============================================================================
vision_llm:
  enabled: false
  provider: "openai"  # Options: openai, azure, ollama
  model: "mimo-v2-pro"
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""
  base_url: "https://token-plan-cn.xiaomimimo.com/v1"
  max_image_size: 2048

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"  # Options: chroma, qdrant, pinecone
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

# =============================================================================
# Rerank Configuration
# =============================================================================
rerank:
  enabled: false
  provider: "none"  # Options: none, cross_encoder, llm
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: false
  provider: "custom"  # Options: ragas, deepeval, custom
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"
    - "answer_similarity"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"  # Options: recursive, semantic, fixed_length
  batch_size: 100

  chunk_refiner:
    use_llm: true

  metadata_enricher:
    use_llm: true
